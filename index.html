<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIGER MUSIC</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
  body{background:#000;color:#fff;padding-bottom:90px}
  .top{padding:20px;display:flex;justify-content:space-between;align-items:center}
  .logo{font-size:24px;font-weight:900}
  .logo span{color:#1DB954}
  .logo small{font-size:12px;color:#aaa;display:block;letter-spacing:3px}
  .searchBox{margin:0 20px;background:#242424;padding:5px 15px;border-radius:30px;display:flex;align-items:center;gap:8px}
  .searchBox input{flex:1;background:none;border:none;outline:none;color:#fff;padding:10px 0;font-size:15px}
  .searchBox input::placeholder{color:#aaa}
  .title{padding:15px 20px;font-size:20px;font-weight:800}
  .card{margin:10px 20px;background:#181818;border-radius:12px;padding:15px;display:flex;gap:15px;align-items:center;cursor:pointer}
  .card.active{border:1px solid #1DB954}
  .cover{width:60px;height:60px;border-radius:8px;background:#1DB954;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#000;flex-shrink:0}
  .card h3{font-size:16px}
  .card p{font-size:13px;color:#aaa;margin-top:3px}
  .playbtn{margin-left:auto;width:42px;height:42px;border-radius:50%;background:#1DB954;border:none;font-size:18px;cursor:pointer;flex-shrink:0}
  .noResult{text-align:center;color:#aaa;padding:30px;display:none}
  .player{position:fixed;bottom:0;left:0;right:0;background:#111;padding:12px 15px;border-top:1px solid #333}
  .player-top{display:flex;justify-content:space-between;align-items:center}
  .player-top b{font-size:14px}
  .player-top span{font-size:12px;color:#aaa;display:block}
  .controls{display:flex;justify-content:center;gap:20px;margin-top:10px}
  .controls button{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
  .controls .main{width:48px;height:48px;background:#fff;color:#000;border-radius:50%;font-size:20px}
  input[type=range]{width:100%;margin-top:10px;accent-color:#1DB954}
</style>
</head>
<body>

<div class="top">
  <div class="logo">LIGER<span>MUSIC</span><small>BY LIGER</small></div>
  <div style="font-size:24px">👤</div>
</div>

<div class="searchBox">
  <span>🔍</span>
  <input type="text" id="searchInput" placeholder="Gaana ya artist search karo..." oninput="searchSong()">
  <span id="clearBtn" onclick="clearSearch()" style="cursor:pointer;display:none">✖</span>
</div>

<div class="title" id="listTitle">Trending Now 🔥</div>
<div id="list"></div>
<div class="noResult" id="noResult">Koi gaana nahi mila 😢<br><br>Dusra naam try karo</div>

<div class="player">
  <div class="player-top">
    <div><b id="nowTitle">Gaana Select Karo</b><span id="nowArtist">LIGER MUSIC</span></div>
    <div id="nowCover" style="font-size:28px">🎵</div>
  </div>
  <input type="range" id="progress" value="0" max="100">
  <div class="controls">
    <button onclick="prevSong()">⏮</button>
    <button class="main" id="playBtn" onclick="togglePlay()">▶</button>
    <button onclick="nextSong()">⏭</button>
  </div>
</div>

<script>
const songs = [
  {title:"Tere Bina - Liger", artist:"Liger", emoji:"🔥", url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"},
  {title:"Karachi Nights", artist:"Liger", emoji:"🌙", url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"},
  {title:"Danish Vibes", artist:"Danish x Liger", emoji:"💚", url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"},
  {title:"Chill Mode", artist:"Liger", emoji:"😎", url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"},
  {title:"Sad Song", artist:"Danish", emoji:"💔", url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"},
  {title:"Party Night", artist:"Liger", emoji:"🎉", url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3"},
];
let current = 0;
let audio = new Audio();
const list = document.getElementById('list');
const playBtn = document.getElementById('playBtn');

function renderList(filter=""){
  list.innerHTML = "";
  let filtered = songs.filter(s => (s.title + s.artist).toLowerCase().includes(filter.toLowerCase()));
  document.getElementById('noResult').style.display = filtered.length ? 'none' : 'block';
  document.getElementById('listTitle').innerText = filter ? `Results for "${filter}"` : 'Trending Now 🔥';
  filtered.forEach((s)=>{
    let realIndex = songs.indexOf(s);
    const div = document.createElement('div');
    div.className = 'card' + (realIndex===current && audio.src ? ' active' : '');
    div.innerHTML = `<div class="cover">${s.emoji}</div><div><h3>${s.title}</h3><p>${s.artist}</p></div><button class="playbtn">▶</button>`;
    div.onclick = ()=> playSong(realIndex);
    list.appendChild(div);
  });
}
function searchSong(){
  let val = document.getElementById('searchInput').value;
  document.getElementById('clearBtn').style.display = val ? 'block' : 'none';
  renderList(val);
}
function clearSearch(){
  document.getElementById('searchInput').value = "";
  document.getElementById('clearBtn').style.display = 'none';
  renderList("");
}
function playSong(i){
  current = i;
  audio.src = songs[i].url;
  audio.play();
  playBtn.innerText = '⏸';
  document.getElementById('nowTitle').innerText = songs[i].title;
  document.getElementById('nowArtist').innerText = songs[i].artist;
  document.getElementById('nowCover').innerText = songs[i].emoji;
  renderList(document.getElementById('searchInput').value);
}
function togglePlay(){
  if(!audio.src){ playSong(0); return; }
  if(audio.paused){ audio.play(); playBtn.innerText='⏸'; } else { audio.pause(); playBtn.innerText='▶'; }
}
function nextSong(){ playSong((current+1)%songs.length); }
function prevSong(){ playSong((current-1+songs.length)%songs.length); }
audio.ontimeupdate = ()=>{
  if(audio.duration){ document.getElementById('progress').value = (audio.currentTime/audio.duration)*100; }
};
document.getElementById('progress').oninput = (e)=>{
  if(audio.duration){ audio.currentTime = (e.target.value/100)*audio.duration; }
};
audio.onended = ()=> nextSong();
renderList("");
</script>
</body>
</html>
